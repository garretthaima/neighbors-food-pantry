apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pantry
  labels:
    {{- include "pantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  parentRefs:
    - name: {{ required "gateway.name is required" .Values.gateway.name }}
      {{- with .Values.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    {{- range required "hosts (list) is required" .Values.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: Content-Security-Policy
                value: "frame-ancestors 'none'"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              # camera=(self): the scan screen can read barcodes with the
              # phone camera.
              - name: Permissions-Policy
                value: "geolocation=(), microphone=(), camera=(self)"
      backendRefs:
        - name: pantry
          port: {{ .Values.app.port }}
