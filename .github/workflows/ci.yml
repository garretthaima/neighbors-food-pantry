name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Type-check, lint, tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            - name: Migration guard
              if: github.event_name == 'pull_request'
              run: python3 scripts/ci/check_migration_edits.py "origin/${{ github.base_ref }}"
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test

    e2e:
        name: Browser tests (phone + desktop)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            - run: node_modules/.bin/playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: test-results/
                  retention-days: 7
